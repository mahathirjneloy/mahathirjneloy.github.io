<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>MOJA - Electron Snake</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23000'/><rect x='1' y='1' width='30' height='30' rx='8' fill='none' stroke='%2310b981' stroke-width='2'/><text x='16' y='21' font-family='system-ui,sans-serif' font-weight='700' font-size='12' fill='%23b7f5d6' text-anchor='middle'>MJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--b1:#b7f5d6;--b2:#6ee7b7;--b3:#34d399;--b4:#10b981;--line:rgba(255,255,255,.1);--mut:#8d95a8;--txt:#c5cad6;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--txt);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;line-height:1.5;display:flex;justify-content:center;padding:1.25rem;background-image:radial-gradient(60rem 30rem at 50% -8%,rgba(5,66,44,.4),transparent 70%),radial-gradient(34rem 34rem at 12% 90%,rgba(16,185,129,.14),transparent 65%)}
.wrap{width:100%;max-width:38rem;padding-top:1.5rem}
.back{display:inline-block;font:.78rem var(--mono);color:var(--b3);text-decoration:none;margin-bottom:1.25rem}.back:hover{color:var(--b1)}
.card{padding:1.75rem;border-radius:1.75rem;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 60px -30px rgba(52,211,153,.5)}
.label{font:.72rem var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--b3);margin-bottom:.6rem}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:500;color:#fff;letter-spacing:-.025em;line-height:1.15;margin-bottom:.75rem}
p.s{font-weight:300;margin-bottom:1rem}
.top{display:flex;justify-content:space-between;font:.75rem var(--mono);color:var(--mut)}.top b{color:var(--b2);font-weight:500}
button{font:inherit;cursor:pointer}
.go{display:inline-block;padding:.9rem 1.75rem;border-radius:999px;border:0;background:#fff;color:#111;font-weight:600;transition:.2s}.go:hover{background:var(--b1);box-shadow:0 0 34px -6px rgba(52,211,153,.6)}
canvas{display:block;width:100%;height:auto;border-radius:1.1rem;border:1px solid var(--line);margin:.9rem 0;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,4rem);gap:.5rem;justify-content:center;margin-bottom:1rem}
.pb{height:3rem;border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;font-size:1.1rem;touch-action:manipulation}.pb:active{background:rgba(52,211,153,.25)}
.gc{display:block;text-decoration:none;padding:1.1rem 1.25rem;margin-bottom:.9rem;border-radius:1.25rem;background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.2s}
.gc:hover{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.07)}.gc b{display:block;color:#fff;font-weight:500;font-size:1.15rem}.gc span{font-size:.85rem;font-weight:300}.gc em{float:right;font:normal .72rem var(--mono);color:var(--b3)}
</style></head><body>
<div class="wrap"><a class="back" href="moja.html">&larr; All games</a>
<div class="card"><p class="label">// MOJA</p><h1>Electron Snake</h1>
<p class="s">Guide the electron chain and collect components (R, C, L, V). Hit a wall or yourself and the circuit breaks. Arrow keys / WASD, or the buttons on mobile.</p>
<div class="top"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<div class="pad"><button class="pb" style="grid-column:2" onpointerdown="turn(0,-1)">&#9650;</button><button class="pb" style="grid-column:1;grid-row:2" onpointerdown="turn(-1,0)">&#9664;</button><button class="pb" style="grid-column:2;grid-row:2" onpointerdown="turn(0,1)">&#9660;</button><button class="pb" style="grid-column:3;grid-row:2" onpointerdown="turn(1,0)">&#9654;</button></div>
<button class="go" id="go" onclick="begin()">Start</button></div></div>
<script>
const $=s=>document.querySelector(s),R=a=>a[Math.random()*a.length|0];
const cv=$('#c'),x=cv.getContext('2d'),N=20,S=cv.width/N;
let sn=[],dir={x:1,y:0},nd=dir,food=null,score=0,speed=130,tm,state='idle';
const best=()=>{try{return+localStorage.getItem('moja-snake')||0}catch(e){return 0}};
const save=v=>{try{localStorage.setItem('moja-snake',v)}catch(e){}};
$('#bs').textContent=best();
const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0,t:R(['R','C','L','V'])}}while(sn.some(s=>s.x===food.x&&s.y===food.y))}
function begin(){clearTimeout(tm);sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nd={x:1,y:0};score=0;speed=130;place();state='run';$('#sc').textContent=0;$('#go').textContent='Restart';draw();tm=setTimeout(step,speed)}
function step(){
  dir=nd;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(s=>s.x===h.x&&s.y===h.y))return over();
  sn.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;$('#sc').textContent=score;speed=Math.max(65,speed-3);place()}else sn.pop();
  draw();tm=setTimeout(step,speed);
}
function over(){state='over';if(score>best()){save(score);$('#bs').textContent=score}draw()}
function turn(dx,dy){
  if(state==='idle')begin();
  if(state!=='run'||dx+dir.x===0&&dy+dir.y===0)return;
  nd={x:dx,y:dy};
}
function msg(a,b){x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,400,400);x.textAlign='center';x.textBaseline='middle';x.fillStyle='#b7f5d6';x.font='500 24px Outfit,sans-serif';x.fillText(a,200,185);x.fillStyle='#8d95a8';x.font='14px monospace';x.fillText(b,200,220)}
function draw(){
  x.fillStyle='#020504';x.fillRect(0,0,400,400);
  x.strokeStyle='rgba(52,211,153,.07)';x.lineWidth=1;x.beginPath();
  for(let i=1;i<N;i++){x.moveTo(i*S,0);x.lineTo(i*S,400);x.moveTo(0,i*S);x.lineTo(400,i*S)}x.stroke();
  if(food){x.fillStyle='#fbbf24';rr(food.x*S+2,food.y*S+2,S-4,S-4,5);x.fill();x.fillStyle='#000';x.font='bold 13px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(food.t,food.x*S+S/2,food.y*S+S/2+1)}
  sn.forEach((s,i)=>{x.fillStyle=i?'#10b981':'#b7f5d6';x.shadowColor='#34d399';x.shadowBlur=i?0:12;rr(s.x*S+1,s.y*S+1,S-2,S-2,5);x.fill()});x.shadowBlur=0;
  if(state==='idle')msg('Electron Snake','Press an arrow key or Start');
  if(state==='over')msg('Circuit broken! Score: '+score,'Press Space or Restart');
}
document.addEventListener('keydown',e=>{
  const k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
  if(k){e.preventDefault();turn(k[0],k[1])}
  else if((e.key===' '||e.key==='Enter')&&state!=='run'){e.preventDefault();begin()}
});
draw();
</script></body></html>

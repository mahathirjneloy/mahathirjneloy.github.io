<style>
:root{--b1:#b7f5d6;--b3:#34d399;--line:rgba(255,255,255,.1);--mut:#8d95a8;--txt:#c5cad6;--mono:'JetBrains Mono',monospace}

body{background:#000;color:var(--txt);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;line-height:1.5;padding:1.25rem max(1.25rem,env(safe-area-inset-right)) 2rem max(1.25rem,env(safe-area-inset-left));background-image:radial-gradient(60rem 30rem at 50% -8%,rgba(5,66,44,.5),transparent 70%),radial-gradient(34rem 34rem at 8% 95%,rgba(16,185,129,.14),transparent 65%)}

.back{display:inline-block;font:.78rem var(--mono);color:var(--b3);text-decoration:none}.back:hover{color:var(--b1)}
header{text-align:center;margin:1.5rem 0 1.75rem}
.label{font:.72rem var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--b3)}

.tab{font:700 .72rem var(--hd,var(--mono));text-transform:uppercase;letter-spacing:.08em;padding:.55rem 1rem;background:transparent;color:var(--b1);border:2px solid rgba(52,211,153,.5);cursor:pointer;transition:.2s}
.tab:hover,.tab:focus-visible{background:rgba(52,211,153,.18);outline:none}
.tab[aria-pressed="true"]{background:var(--b3);border-color:var(--b3);color:#000}
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:2.5rem;border-top:1px solid var(--line)}

.ph::before{content:'';position:absolute;inset:0;background:var(--chipart) center/90px 90px;opacity:.3}
.ph span{position:relative}

<div class="wrap">
<a class="back" href="index.html">&larr; Back to portfolio</a>
<header><p class="label">Updates</p><h1>What's new</h1><p>Notices, routines and more.</p></header>
<div class="tabs" id="tabs"></div>
<main id="list"></main>
<p id="empty" hidden>No updates yet.</p>
<button class="more" id="more" type="button" hidden>Show more</button>
</div>
<script src="updates-data.js"></script>
<script>
(function(){
var D=(window.UPDATES||[]).slice(),PAGE=24,shown=PAGE,cat='All';
var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var PREF=['Notice','Class Routine','Academic Routine'];
D.sort(function(a,b){var x=a.d||'',y=b.d||'';return x<y?1:x>y?-1:0});
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ok(u){return /^(https?:|[^:]*$)/i.test(u)}
function fd(s){var p=String(s||'').split('-');return p.length<3||!M[+p[1]-1]?'':(+p[2])+' '+M[+p[1]-1]+' '+p[0]}
function isNew(s){var t=(Date.now()-new Date(s+'T00:00:00'))/864e5;return t>=0&&t<=2}
function kind(u){var l=u.toLowerCase().split('?')[0];return /\.pdf$/.test(l)?'PDF':/\.(jpe?g|png|webp|gif)$/.test(l)?'Image':/^https?:/.test(l)?'Link':'File'}
function card(x){
 var href=x.u&&ok(x.u)?x.u:'';
 var r=el(href?'a':'div','it');
 if(href){r.href=href;r.target='_blank';r.rel='noopener noreferrer'}
 var th=el('div','th'),ph=el('div','ph'),sp=el('span','',x.c||'Update');
 ph.appendChild(sp);th.appendChild(ph);
 if(x.i&&ok(x.i)){var im=new Image();im.alt='';im.loading='lazy';im.decoding='async';
  im.addEventListener('error',function(){im.remove()});im.src=x.i;th.appendChild(im)}
 var tx=el('div','tx'),m=el('div','meta');
 m.appendChild(el('span','',x.c||'Update'));
 var d=fd(x.d);if(d){var t=el('time','',d);m.appendChild(t)}
 if(x.d&&isNew(x.d))m.appendChild(el('span','new','New'));
 if(href)m.appendChild(el('span','',kind(href)));
 tx.appendChild(m);tx.appendChild(el('div','tt',x.t||''));
 r.appendChild(th);r.appendChild(tx);return r}
function render(){
 var list=D.filter(function(x){return cat==='All'||x.c===cat});
 var box=document.getElementById('list');box.textContent='';
 list.slice(0,shown).forEach(function(x){box.appendChild(card(x))});
 document.getElementById('more').hidden=list.length<=shown;
 document.getElementById('empty').hidden=list.length>0}
var cats=[];D.forEach(function(x){if(x.c&&cats.indexOf(x.c)<0)cats.push(x.c)});
cats.sort(function(a,b){var i=PREF.indexOf(a),j=PREF.indexOf(b);if(i<0)i=99;if(j<0)j=99;return i-j||a.localeCompare(b)});
var tabs=document.getElementById('tabs');
if(cats.length>1)['All'].concat(cats).forEach(function(c){
 var b=el('button','tab',c);b.type='button';b.setAttribute('aria-pressed',c==='All'?'true':'false');
 b.addEventListener('click',function(){cat=c;shown=PAGE;
  Array.prototype.forEach.call(tabs.children,function(o){o.setAttribute('aria-pressed',o===b?'true':'false')});render()});
 tabs.appendChild(b)});
document.getElementById('more').addEventListener('click',function(){shown+=PAGE;render()});
render();
})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MOJA | Circuit Blitz</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23000'/><rect x='1' y='1' width='30' height='30' rx='8' fill='none' stroke='%2310b981' stroke-width='2'/><text x='16' y='21' font-family='system-ui,sans-serif' font-weight='700' font-size='12' fill='%23b7f5d6' text-anchor='middle'>MJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--b1:#b7f5d6;--b2:#6ee7b7;--b3:#34d399;--b4:#10b981;--line:rgba(255,255,255,.1);--mut:#8d95a8;--txt:#c5cad6;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--txt);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;line-height:1.5;display:flex;justify-content:center;padding:1.25rem;
background-image:radial-gradient(60rem 30rem at 50% -8%,rgba(5,66,44,.4),transparent 70%),radial-gradient(34rem 34rem at 12% 90%,rgba(16,185,129,.14),transparent 65%)}
.wrap{width:100%;max-width:38rem;padding-top:1.5rem}
.back{display:inline-block;font:.78rem var(--mono);color:var(--b3);text-decoration:none;margin-bottom:1.25rem}.back:hover{color:var(--b1)}
.card{padding:1.75rem;border-radius:1.75rem;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 60px -30px rgba(52,211,153,.5)}
.label{font:.72rem var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--b3);margin-bottom:.6rem}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:500;color:#fff;letter-spacing:-.025em;line-height:1.15;margin-bottom:.75rem}
p.s{font-weight:300;color:var(--txt);margin-bottom:1.25rem}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:.4rem 0 1.25rem}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b4),var(--b2));transition:width .3s}
.top{display:flex;justify-content:space-between;font:.75rem var(--mono);color:var(--mut)}.top b{color:var(--b2);font-weight:500}
.q{font-size:1.25rem;color:#fff;font-weight:400;margin-bottom:1.25rem;min-height:4.2rem}
.opts{display:grid;gap:.75rem;grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer}
.o{padding:.9rem 1rem;border-radius:1.1rem;background:rgba(255,255,255,.04);border:1px solid var(--line);color:#fff;font:500 1rem var(--mono);text-align:left;transition:.15s}
.o:hover:not(:disabled){border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.08)}
.o small{color:var(--mut);margin-right:.5rem;font-size:.7rem}
.o.ok{border-color:var(--b3);background:rgba(52,211,153,.2);color:var(--b1)}.o.bad{border-color:#ef4444;background:rgba(239,68,68,.15)}
.o:disabled{cursor:default}
.go{display:inline-block;padding:.9rem 1.75rem;border-radius:999px;border:0;background:#fff;color:#111;font-weight:600;transition:.2s}.go:hover{background:var(--b1);box-shadow:0 0 34px -6px rgba(52,211,153,.6)}
.big{font:500 3rem var(--mono);color:var(--b1);margin:.25rem 0}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back to portfolio</a>
  <div class="card" id="app"></div>
</div>
<script>
const $ = s => document.querySelector(s), R = a => a[Math.random() * a.length | 0], m = v => +v.toFixed(2);
const TOTAL = 10;
const Q = [
  () => { const r = R([2,4,5,10,20,50,100]), i = R([1,2,3,5]); return { q: `A ${r} Ω resistor carries ${i} A. Voltage across it?`, a: i*r, u: 'V' } },
  () => { const r = R([2,4,5,10,20,50]), i = R([2,3,4,5]); return { q: `${r*i} V is applied across ${r} Ω. What current flows?`, a: i, u: 'A' } },
  () => { const v = R([5,10,12,24]), i = R([2,3,5]); return { q: `A ${v} V supply delivers ${i} A. Power?`, a: v*i, u: 'W' } },
  () => { const a = R([10,20,47,100]), b = R([10,22,33,68]), c = R([5,15,30]); return { q: `${a} Ω, ${b} Ω and ${c} Ω in series. Total resistance?`, a: a+b+c, u: 'Ω' } },
  () => { const [a,b] = R([[6,3],[12,4],[20,5],[30,15],[60,40],[10,10],[12,6],[100,25]]); return { q: `${a} Ω in parallel with ${b} Ω. Equivalent resistance?`, a: a*b/(a+b), u: 'Ω', w: [a+b] } },
  () => { const r = R([1,2,5,10]), c = R([10,20,50,100]); return { q: `RC circuit: R = ${r} kΩ, C = ${c} µF. Time constant τ?`, a: r*c, u: 'ms' } },
  () => { const t = R([1,2,4,5,10,20,25,50]); return { q: `A signal has period ${t} ms. Frequency?`, a: 1000/t, u: 'Hz' } },
  () => { const r = R([2,4,5,10]), i = R([2,3,4,5]); return { q: `${i} A flows through ${r} Ω. Power dissipated? (P = I²R)`, a: i*i*r, u: 'W' } }
];
function opts(x){
  x.a = m(x.a);
  const rest = [x.a*2, x.a/2, x.a*10, x.a/10, x.a+1, x.a-1, x.a*1.5].map(m).sort(() => Math.random() - .5);
  const pool = [...new Set([...(x.w || []).map(m), ...rest])].filter(v => v > 0 && v !== x.a).slice(0, 3);
  return [...pool, x.a].sort(() => Math.random() - .5);
}
let n, score, cur, locked, deck;
const best = () => { try { return +localStorage.getItem('moja-best') || 0 } catch (e) { return 0 } };
const save = v => { try { localStorage.setItem('moja-best', v) } catch (e) {} };

function start(){
  $('#app').innerHTML = `<p class="label">// MOJA</p><h1>Circuit Blitz</h1>
  <p class="s">${TOTAL} quick EEE questions: Ohm's law, power, series/parallel, RC, frequency. 10 points each. Use the buttons or keys 1&ndash;4.</p>
  <p class="s mono" style="font-family:var(--mono);font-size:.8rem;color:var(--b2)">Best score: ${best()} / ${TOTAL*10}</p>
  <button class="go" onclick="begin()">Start</button>`;
}
function begin(){ n = 0; score = 0; deck = []; next(); }
function next(){
  if (n >= TOTAL) return end();
  if (!deck.length) deck = [...Q].sort(() => Math.random() - .5);
  cur = deck.pop()(); cur.o = opts(cur); locked = false; n++;
  $('#app').innerHTML = `<div class="top"><span>Question <b>${n}</b>/${TOTAL}</span><span>Score <b>${score}</b></span></div>
  <div class="bar"><i style="width:${(n-1)/TOTAL*100}%"></i></div>
  <div class="q">${cur.q}</div>
  <div class="opts">${cur.o.map((v,i) => `<button class="o" data-v="${v}" onclick="pick(this)"><small>${i+1}</small>${v} ${cur.u}</button>`).join('')}</div>`;
}
function pick(b){
  if (locked) return; locked = true;
  const ok = +b.dataset.v === cur.a;
  if (ok) score += 10;
  b.classList.add(ok ? 'ok' : 'bad');
  document.querySelectorAll('.o').forEach(x => { x.disabled = true; if (+x.dataset.v === cur.a) x.classList.add('ok') });
  setTimeout(next, ok ? 700 : 1400);
}
function end(){
  const nb = score > best(); if (nb) save(score);
  const t = score >= 90 ? 'Chief Engineer' : score >= 60 ? 'Solid circuit' : 'Check your wiring';
  $('#app').innerHTML = `<p class="label">// Result</p><div class="big">${score}<span style="font-size:1.2rem;color:var(--mut)"> / ${TOTAL*10}</span></div>
  <h1 style="font-size:1.6rem">${t}</h1>
  <p class="s">${nb ? 'New best score!' : 'Best score: ' + best()}</p>
  <button class="go" onclick="begin()">Play again</button>`;
}
document.addEventListener('keydown', e => {
  const k = +e.key; if (k >= 1 && k <= 4 && !locked && cur && n && n <= TOTAL && document.querySelector('.o')) document.querySelectorAll('.o')[k-1]?.click();
});
start();
</script>
</body>
</html>

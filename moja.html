<script>
const g=k=>{try{return+localStorage.getItem(k)||0}catch(e){return 0}};
const set=(id,v)=>{document.getElementById(id).textContent=v};
function scores(){
  set('b1',g('moja-best')+'/100');
  // Snake saves one score per difficulty: show the highest and say which one
  const top=['easy','medium','hard'].map(m=>[g('moja-snake-'+m),m]).sort((a,b)=>b[0]-a[0])[0];
  set('b2',top[0]);
  set('l2',top[0]?'Best · '+top[1]:'Best score');
  set('b3',g('moja-runner'));
}
scores();
addEventListener('pageshow',scores);

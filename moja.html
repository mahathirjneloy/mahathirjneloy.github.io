<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>MOJA - Games</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23000'/><rect x='1' y='1' width='30' height='30' rx='8' fill='none' stroke='%2310b981' stroke-width='2'/><text x='16' y='21' font-family='system-ui,sans-serif' font-weight='700' font-size='12' fill='%23b7f5d6' text-anchor='middle'>MJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--b1:#b7f5d6;--b2:#6ee7b7;--b3:#34d399;--b4:#10b981;--line:rgba(255,255,255,.1);--mut:#8d95a8;--txt:#c5cad6;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--txt);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;line-height:1.5;display:flex;justify-content:center;padding:1.25rem;background-image:radial-gradient(60rem 30rem at 50% -8%,rgba(5,66,44,.4),transparent 70%),radial-gradient(34rem 34rem at 12% 90%,rgba(16,185,129,.14),transparent 65%)}
.wrap{width:100%;max-width:38rem;padding-top:1.5rem}
.back{display:inline-block;font:.78rem var(--mono);color:var(--b3);text-decoration:none;margin-bottom:1.25rem}.back:hover{color:var(--b1)}
.card{padding:1.75rem;border-radius:1.75rem;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 60px -30px rgba(52,211,153,.5)}
.label{font:.72rem var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--b3);margin-bottom:.6rem}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:500;color:#fff;letter-spacing:-.025em;line-height:1.15;margin-bottom:.75rem}
p.s{font-weight:300;margin-bottom:1rem}
.top{display:flex;justify-content:space-between;font:.75rem var(--mono);color:var(--mut)}.top b{color:var(--b2);font-weight:500}
button{font:inherit;cursor:pointer}
.go{display:inline-block;padding:.9rem 1.75rem;border-radius:999px;border:0;background:#fff;color:#111;font-weight:600;transition:.2s}.go:hover{background:var(--b1);box-shadow:0 0 34px -6px rgba(52,211,153,.6)}
canvas{display:block;width:100%;height:auto;border-radius:1.1rem;border:1px solid var(--line);margin:.9rem 0;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,4rem);gap:.5rem;justify-content:center;margin-bottom:1rem}
.pb{height:3rem;border-radius:1rem;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;font-size:1.1rem;touch-action:manipulation}.pb:active{background:rgba(52,211,153,.25)}
.gc{display:block;text-decoration:none;padding:1.1rem 1.25rem;margin-bottom:.9rem;border-radius:1.25rem;background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.2s}
.gc:hover{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.07)}.gc b{display:block;color:#fff;font-weight:500;font-size:1.15rem}.gc span{font-size:.85rem;font-weight:300}.gc em{float:right;font:normal .72rem var(--mono);color:var(--b3)}
</style></head><body>
<div class="wrap"><a class="back" href="index.html">&larr; Back to portfolio</a>
<div class="card"><p class="label">// MOJA</p><h1>Pick a game</h1><p class="s">Tiny EEE-themed games.</p>
<a class="gc" href="quiz.html"><em id="b1"></em><b>Circuit Blitz</b><span>10-question EEE quiz: Ohm's law, power, RC</span></a>
<a class="gc" href="snake.html"><em id="b2"></em><b>Electron Snake</b><span>Collect R, C, L and V components</span></a>
<a class="gc" href="runner.html"><em id="b3"></em><b>Spark Runner</b><span>Jump over circuit components</span></a></div></div>
<script>
const g=k=>{try{return+localStorage.getItem(k)||0}catch(e){return 0}};
document.getElementById('b1').textContent='Best '+g('moja-best')+'/100';
document.getElementById('b2').textContent='Best '+g('moja-snake');
document.getElementById('b3').textContent='Best '+g('moja-runner');
</script></body></html>
